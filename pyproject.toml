[project]
name = "simplebank"
version = "0.1.0"
description = "SimpleBank: a small REST API for bank accounts, transactions and transfers."
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "django-filter>=26.1",
    "django-stubs-ext>=6.1.1",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.1",
    "djangorestframework-stubs>=3.18.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-env>=1.7.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "DJ", "PT"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"conftest.py" = ["S101"]
"**/migrations/**" = ["E501", "RUF012"]
"**/models.py" = ["RUF012"]  # Django's Meta options are plain class attributes

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["dj_database_url", "django_filters.*", "rest_framework_simplejwt.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["banking.filters"]
disallow_subclassing_any = false  # django-filter ships no type hints

[[tool.mypy.overrides]]
module = ["users.schema", "tests.test_project"]
disallow_untyped_calls = false  # drf-spectacular's extension and generator APIs are untyped

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-ra --strict-markers"
python_files = ["test_*.py"]
env = ["DJANGO_SECRET_KEY=django-insecure-test-only-key-not-for-real-use"]
filterwarnings = [
    "error",
    # Tests do not run collectstatic, so WhiteNoise has no static directory to serve.
    "ignore:No directory at:UserWarning",
]
