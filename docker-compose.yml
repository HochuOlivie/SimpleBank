services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: simplebank
      POSTGRES_USER: simplebank
      POSTGRES_PASSWORD: simplebank
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplebank -d simplebank"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgres://simplebank:simplebank@db:5432/simplebank
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-docker-compose-only}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
