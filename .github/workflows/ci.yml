name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: simplebank
          POSTGRES_USER: simplebank
          POSTGRES_PASSWORD: simplebank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simplebank"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://simplebank:simplebank@localhost:5432/simplebank
      DJANGO_SECRET_KEY: django-insecure-ci-only-key-not-for-real-use
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run mypy .
      - name: Test
        run: uv run pytest

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the stack
        run: docker compose up --detach --build --wait
      - name: Register a user through the running API
        run: |
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 \
            --json '{"email": "smoke@example.com", "password": "correct horse battery staple"}' \
            http://localhost:8000/api/v1/auth/register/
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
